
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Live Clock & Interactive Calendar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d19;
      --panel: rgba(19, 28, 49, .88);
      --panel-2: #111b30;
      --text: #eef3ff;
      --muted: #9aa8c3;
      --accent: #7c9cff;
      --accent-2: #52dbc2;
      --border: rgba(159, 180, 220, .15);
      --today: rgba(124, 156, 255, .18);
      --shadow: 0 24px 70px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(74, 102, 190, .22), transparent 38%),
        radial-gradient(ellipse at 90% 85%, rgba(38, 177, 159, .13), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }

    .app {
      width: min(100%, 980px);
      display: grid;
      gap: 20px;
    }

    .topline {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .eyebrow {
      color: var(--accent-2);
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:.72rem;
      font-weight:800;
    }

    h1 {
      margin:6px 0 0;
      font-size:clamp(1.5rem,4vw,2.15rem);
      letter-spacing:-.04em;
    }

    .pill {
      border:1px solid var(--border);
      color:var(--muted);
      padding:8px 12px;
      border-radius:999px;
      font-size:.8rem;
    }

    .panel {
      background: linear-gradient(145deg, rgba(23,34,59,.96), rgba(13,21,39,.96));
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
    }

    .clock-panel {
      padding:clamp(22px,5vw,38px);
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .clock-panel::before {
      content:"";
      position:absolute;
      width:260px;
      height:260px;
      border-radius:50%;
      background:rgba(124,156,255,.08);
      filter:blur(45px);
      top:-160px;
      left:calc(50% - 130px);
    }

    .clock-label {
      color:var(--muted);
      font-size:.82rem;
      letter-spacing:.13em;
      text-transform:uppercase;
    }

    #clock {
      font-variant-numeric:tabular-nums;
      font-size:clamp(3rem,10vw,6.2rem);
      font-weight:750;
      letter-spacing:-.065em;
      line-height:1.1;
      margin:14px 0 10px;
      position:relative;
    }

    #ampm {
      font-size:.28em;
      letter-spacing:0;
      color:var(--accent-2);
      margin-left:8px;
    }

    #dateLine {
      color:#c2cce0;
      font-size:clamp(.95rem,2.5vw,1.15rem);
    }

    .clock-footer {
      display:flex;
      justify-content:center;
      gap:9px;
      flex-wrap:wrap;
      margin-top:22px;
    }

    .clock-footer span {
      color:var(--muted);
      font-size:.78rem;
      border:1px solid var(--border);
      padding:7px 11px;
      border-radius:999px;
    }

    .calendar-panel {
      padding:clamp(18px,4vw,30px);
    }

    .calendar-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:22px;
    }

    .month-title {
      font-size:1.35rem;
      font-weight:750;
      letter-spacing:-.03em;
    }

    .nav {
      display:flex;
      gap:8px;
    }

    button {
      font:inherit;
      cursor:pointer;
      color:var(--text);
    }

    .icon-btn, .today-btn {
      border:1px solid var(--border);
      background:var(--panel-2);
      border-radius:12px;
      min-width:42px;
      height:42px;
      transition:.18s ease;
    }

    .icon-btn:hover, .today-btn:hover {
      border-color:var(--accent);
      background:rgba(124,156,255,.13);
    }

    .today-btn {
      padding:0 14px;
      font-size:.84rem;
    }

    .weekdays, .days {
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:7px;
    }

    .weekdays { margin-bottom:8px; }

    .weekdays div {
      text-align:center;
      color:var(--muted);
      font-size:.75rem;
      font-weight:700;
      padding:8px 0;
    }

    .day {
      min-height:clamp(46px,8vw,76px);
      border:1px solid transparent;
      border-radius:13px;
      background:rgba(255,255,255,.025);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      position:relative;
      transition:.16s ease;
      padding:5px 2px;
    }

    .day:hover {
      background:rgba(124,156,255,.12);
      border-color:rgba(124,156,255,.35);
    }

    .day.muted {
      color:#63718b;
      background:transparent;
    }

    .day.today {
      background:var(--today);
      border-color:rgba(124,156,255,.55);
      color:#fff;
      font-weight:800;
    }

    .day.selected {
      outline:2px solid var(--accent-2);
      outline-offset:1px;
    }

    .day .num { font-size:.92rem; }

    .dot {
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--accent-2);
    }

    .calendar-bottom {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:22px;
    }

    .info-box {
      background:rgba(255,255,255,.035);
      border:1px solid var(--border);
      border-radius:16px;
      padding:15px;
      min-width:0;
    }

    .info-label {
      color:var(--muted);
      font-size:.75rem;
      text-transform:uppercase;
      letter-spacing:.1em;
    }

    #selectedDate {
      margin-top:7px;
      font-weight:700;
    }

    .event-row {
      display:flex;
      align-items:center;
      gap:9px;
      margin-top:10px;
      color:#d5def0;
      font-size:.88rem;
    }

    .event-marker {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--accent-2);
      flex:none;
    }

    .empty {
      color:var(--muted);
      font-size:.86rem;
      margin-top:10px;
    }

    .footer {
      color:#71809b;
      text-align:center;
      font-size:.76rem;
    }

    @media (max-width:560px) {
      body { padding:18px 10px; }
      .topline { align-items:flex-start; }
      .pill { font-size:.7rem; }
      .calendar-head { margin-bottom:15px; }
      .weekdays, .days { gap:4px; }
      .day { border-radius:9px; }
      .calendar-bottom { grid-template-columns:1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after {
        transition:none !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="topline">
      <div>
        <div class="eyebrow">Your time, at a glance</div>
        <h1>Clock & Calendar</h1>
      </div>
      <div class="pill">LOCAL TIME</div>
    </header>

    <section class="panel clock-panel" aria-label="Live digital clock">
      <div class="clock-label">Current time</div>
      <div id="clock" aria-live="off">
        --:--:--<span id="ampm"></span>
      </div>
      <div id="dateLine">Loading date…</div>

      <div class="clock-footer">
        <span id="timezone">Time zone</span>
        <span id="utcOffset">UTC offset</span>
      </div>
    </section>

    <section class="panel calendar-panel" aria-label="Interactive calendar">

      <div class="calendar-head">
        <div class="month-title" id="monthTitle">Month Year</div>

        <div class="nav">
          <button class="icon-btn" id="prevMonth"
            aria-label="Previous month" title="Previous month">‹</button>

          <button class="today-btn" id="goToday">Today</button>

          <button class="icon-btn" id="nextMonth"
            aria-label="Next month" title="Next month">›</button>
        </div>
      </div>

      <div class="weekdays" aria-hidden="true">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>

      <div class="days" id="calendarDays"></div>

      <div class="calendar-bottom">

        <div class="info-box">
          <div class="info-label">Selected date</div>
          <div id="selectedDate">—</div>
        </div>

        <div class="info-box">
          <div class="info-label">Events & notes</div>
          <div id="eventsList" class="empty">
            No events for this date.
          </div>
        </div>

      </div>
    </section>

    <div class="footer">
      The clock updates every second. Calendar dates use your device's local time.
    </div>

  </main>

  <script>
    "use strict";

    const clockEl = document.getElementById("clock");
    const ampmEl = document.getElementById("ampm");
    const dateLineEl = document.getElementById("dateLine");
    const timezoneEl = document.getElementById("timezone");
    const utcOffsetEl = document.getElementById("utcOffset");
    const monthTitleEl = document.getElementById("monthTitle");
    const daysEl = document.getElementById("calendarDays");
    const selectedDateEl = document.getElementById("selectedDate");
    const eventsListEl = document.getElementById("eventsList");

    let viewDate = new Date();
    let selectedDate = new Date();
    selectedDate.setHours(0, 0, 0, 0);

    // Add date-keyed notes here if desired, using YYYY-MM-DD as the key.
    const events = {
      // "2026-12-25": ["Christmas Day"]
    };

    const pad = value => String(value).padStart(2, "0");

    const dateKey = date =>
      `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const hour12 = hours % 12 || 12;

      clockEl.firstChild.textContent =
        `${pad(hour12)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      ampmEl.textContent = hours >= 12 ? "PM" : "AM";

      dateLineEl.textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(now);

      const zone =
        Intl.DateTimeFormat().resolvedOptions().timeZone || "Local time";

      const offset = -now.getTimezoneOffset();
      const sign = offset >= 0 ? "+" : "-";

      const offsetText =
        `UTC${sign}${pad(Math.floor(Math.abs(offset) / 60))}:${pad(Math.abs(offset) % 60)}`;

      timezoneEl.textContent = zone;
      utcOffsetEl.textContent = offsetText;
    }

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      monthTitleEl.textContent = new Intl.DateTimeFormat(undefined, {
        month: "long",
        year: "numeric"
      }).format(viewDate);

      const firstDay = new Date(year, month, 1);
      const startOffset = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const previousMonthDays = new Date(year, month, 0).getDate();

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      daysEl.innerHTML = "";

      for (let i = 0; i < 42; i++) {
        let date, inCurrentMonth;

        if (i < startOffset) {
          date = new Date(
            year,
            month - 1,
            previousMonthDays - startOffset + i + 1
          );
          inCurrentMonth = false;

        } else if (i >= startOffset + daysInMonth) {
          date = new Date(
            year,
            month + 1,
            i - startOffset - daysInMonth + 1
          );
          inCurrentMonth = false;

        } else {
          date = new Date(year, month, i - startOffset + 1);
          inCurrentMonth = true;
        }

        date.setHours(0, 0, 0, 0);

        const key = dateKey(date);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";

        button.setAttribute("aria-label",
          new Intl.DateTimeFormat(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
          }).format(date)
        );

        if (!inCurrentMonth) button.classList.add("muted");
        if (date.getTime() === today.getTime()) {
          button.classList.add("today");
        }

        if (date.getTime() === selectedDate.getTime()) {
          button.classList.add("selected");
        }

        const number = document.createElement("span");
        number.className = "num";
        number.textContent = date.getDate();

        button.appendChild(number);

        if (events[key] && events[key].length) {
          const dot = document.createElement("span");
          dot.className = "dot";
          dot.setAttribute("aria-hidden", "true");
          button.appendChild(dot);
        }

        button.addEventListener("click", () => {
          selectedDate = new Date(date);

          if (!inCurrentMonth) {
            viewDate = new Date(
              date.getFullYear(),
              date.getMonth(),
              1
            );
          }

          renderCalendar();
          renderSelectedDate();
        });

        daysEl.appendChild(button);
      }
    }

    function renderSelectedDate() {
      selectedDateEl.textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }).format(selectedDate);

      const items = events[dateKey(selectedDate)] || [];

      eventsListEl.replaceChildren();

      if (!items.length) {
        eventsListEl.className = "empty";
        eventsListEl.textContent = "No events for this date.";
        return;
      }

      eventsListEl.className = "";

      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "event-row";

        const marker = document.createElement("span");
        marker.className = "event-marker";

        const label = document.createElement("span");
        label.textContent = item;

        row.append(marker, label);
        eventsListEl.appendChild(row);
      });
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      viewDate = new Date(
        viewDate.getFullYear(),
        viewDate.getMonth() - 1,
        1
      );

      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      viewDate = new Date(
        viewDate.getFullYear(),
        viewDate.getMonth() + 1,
        1
      );

      renderCalendar();
    });

    document.getElementById("goToday").addEventListener("click", () => {
      const now = new Date();

      selectedDate = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      viewDate = new Date(
        now.getFullYear(),
        now.getMonth(),
        1
      );

      renderCalendar();
      renderSelectedDate();
    });

    updateClock();
    renderCalendar();
    renderSelectedDate();

    setInterval(updateClock, 1000);
  </script>
</body>
</html>
